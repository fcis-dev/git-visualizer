name: Release Git Visualizer

on:
  # Runs automatically when creating a "tag" that starts with v (example: v1.0.0)
  push:
    tags:
      - "v*"
  # Also allows running the Workflow manually from the "Actions" tab in GitHub
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Will build on macOS, Ubuntu and Windows
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install necessary system dependencies for Linux
      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Setup Node.js for the frontend
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      # Setup Rust language for the backend (Tauri)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Install NPM dependencies for the Frontend
      - name: Install frontend dependencies
        run: npm install

      # Official Tauri action that builds and creates the "Release" on GitHub
      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          # Takes the version you have in the `src-tauri/tauri.conf.json` file
          tagName: v__VERSION__
          releaseName: "Git Visualizer v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          # Created as "Draft" so you can review it before publishing. Set to `false` if you want it to publish automatically.
          releaseDraft: true
          prerelease: false
